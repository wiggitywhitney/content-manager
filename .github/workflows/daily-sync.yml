name: Daily Content Sync

on:
  # Manual trigger for testing
  workflow_dispatch:

  # Three slots: morning at 13:17 UTC = 8:17am CDT / 7:17am CST
  #              midday at 17:17 UTC = 12:17pm CDT / 11:17am CST
  #              evening at 21:17 UTC = 4:17pm CDT / 3:17pm CST
  # Single-post mode: every slot first checks whether a managed post already went out today
  # (see src/evening-catch-up.js). If one did, or the run was delayed past midnight UTC, the run
  # skips via the skip_run guard; otherwise it posts as the morning slot. The morning cron normally
  # posts, and the midday and evening runs catch up a dropped or late morning run. Because the
  # morning run checks too, a morning run delayed past a catch-up posts nothing.
  # Two-post mode: morning slot posts social priority, evening slot posts career priority, and the
  # midday run skips.
  # Crons run at :17 rather than :00 because GitHub delays scheduled runs most at the top of the hour.
  schedule:
    - cron: '17 13 * * *'  # Morning slot: 8:17am CDT every day
    - cron: '17 17 * * *'  # Midday catch-up slot: 12:17pm CDT every day
    - cron: '17 21 * * *'  # Evening slot: 4:17pm CDT every day

jobs:
  integration-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run integration tests
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: npm run test:integration

  e2e-tests:
    needs: integration-tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run e2e tests
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          BLUESKY_HANDLE: ${{ secrets.BLUESKY_HANDLE }}
          BLUESKY_APP_PASSWORD: ${{ secrets.BLUESKY_APP_PASSWORD }}
          MASTODON_ACCESS_TOKEN: ${{ secrets.MASTODON_ACCESS_TOKEN }}
          MASTODON_INSTANCE_URL: ${{ secrets.MASTODON_INSTANCE_URL }}
          MICROBLOG_APP_TOKEN: ${{ secrets.MICROBLOG_APP_TOKEN }}
        run: npm run test:e2e

  daily-sync:
    needs: integration-tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 20
    # Overlapping runs (a delayed morning run and the evening run) queue rather than cancel,
    # so an in-progress post is never killed before its posted-today record is written.
    concurrency:
      group: daily-sync-${{ github.ref }}
      cancel-in-progress: false
    env:
      # Set to 'true' to enable two-post-per-day mode (morning=social, evening=career).
      # Set to 'false' (default) to restore one-post-per-day behavior — each run skips posting
      # if a managed post already went out today, so the midday and evening runs only catch up.
      TWO_POSTS_PER_DAY: 'false'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --omit=dev

      - name: Determine post priority
        id: priority
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GITHUB_EVENT_SCHEDULE: ${{ github.event.schedule }}
        run: |
          DAY=$(date +%-d)
          CAREER_FIRST=$((DAY % 2))
          echo "career_first=${CAREER_FIRST}" >> "$GITHUB_OUTPUT"

          # Slot detection: keyed off which cron actually fired (github.event.schedule),
          # not wall-clock time — a delayed or late-firing run is still classified correctly.
          # Empty on workflow_dispatch; falls back to morning (see scripts/determine-slot.sh).
          SLOT=$(scripts/determine-slot.sh "${GITHUB_EVENT_SCHEDULE}")

          if [ "${TWO_POSTS_PER_DAY}" != "true" ]; then
            # In single-post mode, every slot skips if a managed post already went out today
            # (or the run was delayed past midnight UTC); otherwise it posts as the morning slot.
            # This also stops a morning run delayed past a midday or evening catch-up.
            # A failed posted-today check fails the step.
            CATCH_UP=$(node src/evening-catch-up.js "$SLOT") || exit 1
            if [ "$CATCH_UP" != "catch_up" ]; then
              echo "is_morning_slot=false" >> "$GITHUB_OUTPUT"
              echo "skip_run=true" >> "$GITHUB_OUTPUT"
              echo "[priority] ${SLOT} run skipped — managed post already went out today or run started after midnight UTC (single-post mode)"
              exit 0
            fi
            echo "[priority] No managed post today — ${SLOT} run posting as the morning slot"
            IS_MORNING=true
          else
            # In two-post mode, the morning and evening slots post different content types,
            # so the midday run has no slot to catch up and skips.
            case "$SLOT" in
              morning) IS_MORNING=true ;;
              evening) IS_MORNING=false ;;
              *)
                echo "is_morning_slot=false" >> "$GITHUB_OUTPUT"
                echo "skip_run=true" >> "$GITHUB_OUTPUT"
                echo "[priority] ${SLOT} run skipped — TWO_POSTS_PER_DAY=true"
                exit 0
                ;;
            esac
          fi
          echo "is_morning_slot=${IS_MORNING}" >> "$GITHUB_OUTPUT"
          echo "skip_run=false" >> "$GITHUB_OUTPUT"

          # Probe social queue — needed for two-post morning career fallback and single-post priority logic
          if [ "$CAREER_FIRST" -eq 0 ] || [ "${TWO_POSTS_PER_DAY}" = "true" ]; then
            PROBE=$(node -e "const { fetchOldestPendingPost } = require('./src/social-posts-queue'); (async () => { try { const p = await fetchOldestPendingPost(); process.stdout.write(p ? 'pending' : 'empty'); } catch (e) { process.stderr.write(e.message); process.stdout.write('error'); process.exit(2); } })();")
            case "$PROBE" in
              pending) echo "social_has_pending=true" >> "$GITHUB_OUTPUT" ;;
              empty)   echo "social_has_pending=false" >> "$GITHUB_OUTPUT" ;;
              *)       echo "[priority] Failed to probe social queue: $PROBE"; exit 1 ;;
            esac
          else
            echo "social_has_pending=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Scan for new content
        if: steps.priority.outputs.skip_run != 'true'
        continue-on-error: true
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: node src/scan-new-content.js

      - name: Sync content to Micro.blog and update About page
        if: steps.priority.outputs.skip_run != 'true' && ((steps.priority.outputs.career_first == '1' && env.TWO_POSTS_PER_DAY != 'true') || steps.priority.outputs.social_has_pending == 'false' || (steps.priority.outputs.is_morning_slot == 'false' && env.TWO_POSTS_PER_DAY == 'true'))
        env:
          DRY_RUN: 'false'  # Explicitly disable dry-run mode for production
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          MICROBLOG_APP_TOKEN: ${{ secrets.MICROBLOG_APP_TOKEN }}
          MICROBLOG_XMLRPC_TOKEN: ${{ secrets.MICROBLOG_XMLRPC_TOKEN }}
          MICROBLOG_USERNAME: ${{ secrets.MICROBLOG_USERNAME }}
        run: node src/sync-content.js

      - name: Read credentials from GSM
        if: (success() || failure()) && steps.priority.outcome == 'success' && steps.priority.outputs.skip_run != 'true'
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: |
          echo "$GOOGLE_SERVICE_ACCOUNT_JSON" > /tmp/sa-key.json
          gcloud auth activate-service-account --key-file=/tmp/sa-key.json --quiet
          LINKEDIN_ACCESS_TOKEN=$(gcloud secrets versions access latest --secret=linkedin_access_token --project=demoo-ooclock)
          LINKEDIN_TOKEN_EXPIRES_AT=$(gcloud secrets versions access latest --secret=linkedin_token_expires_at --project=demoo-ooclock)
          LINKEDIN_PERSON_URN=$(gcloud secrets versions access latest --secret=linkedin_person_urn --project=demoo-ooclock)
          DD_API_KEY=$(gcloud secrets versions access latest --secret=datadog-commit-story-dev --project=demoo-ooclock 2>/dev/null) || true
          echo "::add-mask::$LINKEDIN_ACCESS_TOKEN"
          echo "::add-mask::$LINKEDIN_TOKEN_EXPIRES_AT"
          echo "::add-mask::$LINKEDIN_PERSON_URN"
          if [ -n "$DD_API_KEY" ]; then echo "::add-mask::$DD_API_KEY"; else echo "[daily-sync] Warning: DD_API_KEY unavailable; token-expiry metric will be skipped"; fi
          echo "LINKEDIN_ACCESS_TOKEN=$LINKEDIN_ACCESS_TOKEN" >> "$GITHUB_ENV"
          echo "LINKEDIN_TOKEN_EXPIRES_AT=$LINKEDIN_TOKEN_EXPIRES_AT" >> "$GITHUB_ENV"
          echo "LINKEDIN_PERSON_URN=$LINKEDIN_PERSON_URN" >> "$GITHUB_ENV"
          echo "DD_API_KEY=$DD_API_KEY" >> "$GITHUB_ENV"
          rm /tmp/sa-key.json

      - name: Emit LinkedIn token expiry metric
        if: (success() || failure()) && steps.priority.outcome == 'success' && steps.priority.outputs.skip_run != 'true'
        run: node -e "const { checkTokenExpiry } = require('./src/post-linkedin'); checkTokenExpiry(process.env.LINKEDIN_TOKEN_EXPIRES_AT).catch(console.error);"

      - name: Post social content
        if: (success() || failure()) && steps.priority.outcome == 'success' && steps.priority.outputs.skip_run != 'true'
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          BLUESKY_HANDLE: ${{ secrets.BLUESKY_HANDLE }}
          BLUESKY_APP_PASSWORD: ${{ secrets.BLUESKY_APP_PASSWORD }}
          MASTODON_ACCESS_TOKEN: ${{ secrets.MASTODON_ACCESS_TOKEN }}
          MASTODON_INSTANCE_URL: ${{ secrets.MASTODON_INSTANCE_URL }}
          MICROBLOG_APP_TOKEN: ${{ secrets.MICROBLOG_APP_TOKEN }}
          IS_MORNING_SLOT: ${{ steps.priority.outputs.is_morning_slot }}
        run: node src/post-social-content.js

      - name: Update page visibility
        if: steps.priority.outputs.skip_run != 'true'
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          MICROBLOG_XMLRPC_TOKEN: ${{ secrets.MICROBLOG_XMLRPC_TOKEN }}
          MICROBLOG_USERNAME: ${{ secrets.MICROBLOG_USERNAME }}
        run: node src/update-page-visibility.js
